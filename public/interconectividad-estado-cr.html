<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interconectividad Sistemas del Estado CR</title>
<script src="/assets/js/d3.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; background: #0d1117; color: #c9d1d9; overflow: hidden; height: 100vh; }

  #header {
    height: 52px; background: #161b22; border-bottom: 1px solid #30363d;
    display: flex; align-items: center; justify-content: space-between; padding: 0 20px;
  }
  .title { font-size: 14px; font-weight: 700; color: #e6edf3; }
  .subtitle { font-size: 11px; color: #7d8590; margin-top: 2px; }

  #controls { display: flex; gap: 6px; align-items: center; }
  .btn {
    padding: 5px 12px; border-radius: 6px; font-size: 11px; cursor: pointer;
    border: 1px solid; background: transparent; font-family: inherit;
    transition: opacity 0.15s, background 0.2s;
  }
  .btn.on  { opacity: 1; }
  .btn.off { opacity: 0.28; }

  .view-btn {
    padding: 7px 16px; border-radius: 8px; font-size: 12px; cursor: pointer;
    border: 2px solid; background: transparent; font-family: inherit;
    font-weight: 700; transition: all 0.25s; margin-right: 4px;
  }
  .view-btn.active { background: rgba(255,255,255,0.1); }
  .view-btn:not(.active) { opacity: 0.4; }

  #tooltip {
    position: fixed; background: #1c2128; border: 1px solid #373e47; border-radius: 8px;
    padding: 13px 15px; font-size: 12px; pointer-events: none; opacity: 0;
    transition: opacity 0.1s; max-width: 270px; z-index: 999;
    box-shadow: 0 8px 32px rgba(0,0,0,0.6);
  }
  .tt-name   { font-size: 14px; font-weight: 700; color: #e6edf3; margin-bottom: 3px; }
  .tt-sector { font-size: 10px; opacity: 0.55; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.6px; }
  .tt-desc   { font-size: 11px; color: #8b949e; line-height: 1.55; margin-bottom: 9px; }
  .tt-sys-label { color: #555d68; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
  .tt-sys-item  { color: #58a6ff; font-size: 10.5px; margin-bottom: 2px; }
  .tt-vc-item   { color: #3fb950; font-size: 10.5px; margin-bottom: 2px; }
  .tt-meta   { margin-top: 8px; font-size: 10px; color: #555d68; }

  #legend {
    position: fixed; bottom: 16px; left: 16px; background: #1c2128;
    border: 1px solid #30363d; border-radius: 8px; padding: 12px 15px; font-size: 11px;
    transition: opacity 0.3s;
  }
  .leg-title { color: #555d68; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; font-size: 9.5px; margin-bottom: 8px; }
  .leg-item  { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; color: #8b949e; white-space: nowrap; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

  #stats {
    position: fixed; top: 62px; right: 16px; background: #1c2128;
    border: 1px solid #30363d; border-radius: 8px; padding: 13px 15px; font-size: 11px; min-width: 200px;
    transition: opacity 0.3s;
  }
  .stat-row   { display: flex; justify-content: space-between; align-items: center; margin-bottom: 7px; }
  .stat-label { color: #8b949e; }
  .stat-val   { font-weight: 700; font-size: 13px; }
  .sep { border: none; border-top: 1px solid #21262d; margin: 8px 0; }

  .node-label { font-weight: 700; text-anchor: middle; pointer-events: none; }
  .node-sub   { text-anchor: middle; pointer-events: none; fill: #7d8590; }
  .iso-badge  { text-anchor: middle; pointer-events: none; fill: #f85149; font-weight: 800; }

  /* Mesh pulse */
  @keyframes pulse { 0%,100%{opacity:0.2} 50%{opacity:0.45} }
  .mesh-glow { animation: pulse 3s ease-in-out infinite; }
  @keyframes meshRotate { 0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)} }
</style>
</head>

<div id="header">

  <div id="controls">

    <button class="btn on" id="btn-strong"  style="border-color:#3fb950;color:#3fb950" onclick="toggle('strong',this)">● Activa</button>

    <button class="btn on" id="btn-missing" style="border-color:#f85149;color:#f85149" onclick="toggle('missing',this)">✕ Brecha</button>

</div>

<div id="tooltip"></div>

<div id="stats">

<div id="legend">

// ── Path helper
function makePath(sNode, tNode, offset) {
  const dx = tNode.x - sNode.x, dy = tNode.y - sNode.y;
  const dist = Math.sqrt(dx*dx + dy*dy) || 1;
  const sr = sNode.r + 4, tr = tNode.r + 12;
  const sx = sNode.x + dx/dist * sr, sy = sNode.y + dy/dist * sr;
  const tx = tNode.x - dx/dist * tr, ty = tNode.y - dy/dist * tr;
  const cx = (sx+tx)/2 - dy * (offset||0.12), cy = (sy+ty)/2 + dx * (offset||0.12);
  return `M${sx},${sy} Q${cx},${cy} ${tx},${ty}`;
}

// ── Offset duplicate pairs
function computeOffsets(linkArr) {
  const pc = {}, pi = {};
  linkArr.forEach(l => { const k = [l.s,l.t].sort().join('|'); pc[k] = (pc[k]||0)+1; });
  linkArr.forEach(l => {
    const k = [l.s,l.t].sort().join('|');
    if (!pi[k]) pi[k] = 0;
    l._offset = (pi[k]++ - (pc[k]-1)/2) * 0.08;
  });
}

const tt = document.getElementById('tooltip');
function showTT(ev, html) { tt.innerHTML = html; tt.style.opacity = 1; moveTooltip(ev); }
function hideTT() { tt.style.opacity = 0; }
function moveTooltip(ev) {
  let x = ev.clientX + 16, y = ev.clientY - 10;
  if (x + 280 > W) x = ev.clientX - 285;
  if (y + 200 > window.innerHeight) y = ev.clientY - 200;
  tt.style.left = x + 'px'; tt.style.top = y + 'px';
}

  const nMissing = todayLinks.filter(l=>l.type==='missing').length;
  const nBilateral = nStrong + nPartial;
  const nFullMesh = nSystems * (nSystems - 1) / 2;
  const coverage = (nBilateral / nFullMesh * 100).toFixed(1);
  const nIssue   = vcLinks.filter(l=>l.type==='issue').length;

  // Find isolated nodes (no todayLinks at all)

  todayLinks.forEach(l => { connectedToday.add(l.s); connectedToday.add(l.t); });

    el.innerHTML = `

      <div class="stat-row"><span class="stat-label">Nodo hub principal</span><span class="stat-val" style="color:#818cf8">${hub?hub[0]:'—'}</span></div>
      <hr class="sep">
      <div class="stat-row"><span class="stat-label">Integraciones bilaterales</span><span class="stat-val" style="color:#d29922">${nBilateral}</span></div>
      <div class="stat-row"><span class="stat-label">Necesarias para N=${nSystems}</span><span class="stat-val" style="color:#f85149">${nFullMesh}</span></div>
      <div class="stat-row"><span class="stat-label">Cobertura</span><span class="stat-val" style="color:#f85149">${coverage}%</span></div>
    `;
  } else {
    el.innerHTML = `

      <hr class="sep">

window.switchView = function(view) {
  currentView = view;
  const dur = 600;

  document.getElementById('view-today').classList.toggle('active', view==='today');
  document.getElementById('view-vc').classList.toggle('active', view==='vc');

  // Filter buttons only relevant in today view
  document.getElementById('btn-strong').style.display = view==='today'?'':'none';
  document.getElementById('btn-partial').style.display = view==='today'?'':'none';
  document.getElementById('btn-missing').style.display = view==='today'?'':'none';

  // Title
  document.getElementById('main-title').textContent = view==='today'
    ? 'Mapa de Interconectividad — Sistemas del Estado de Costa Rica'
    : 'Con Attestto Mesh — Los Ciudadanos son la Integración';
  const nSys = nodes.length;
  const nVC = vcLinks.filter(l=>l.type==='issue').length;
  document.getElementById('main-subtitle').textContent = view==='today'
    ? `${nSys} sistemas · flujos de datos · brechas de integración · 2026`
    : `${nSys} sistemas · ${nVC} tipos de credencial · 0 APIs bilaterales · red P2P descentralizada`;

  // Animate links
  todayLinkG.transition().duration(dur)
    .style('opacity', view==='today'?1:0)
    .style('pointer-events', view==='today'?'all':'none');
  vcLinkG.transition().duration(dur)
    .style('opacity', view==='vc'?1:0)
    .style('pointer-events', view==='vc'?'all':'none');

  // Citizen node
  citizenG.transition().duration(dur)
    .style('opacity', view==='vc'?1:0);

  // Isolation ring + badge
  d3.selectAll('.iso-ring').transition().duration(dur)
    .attr('opacity', view==='today'?0.7:0)
    .attr('stroke', view==='today'?'#f85149':'#3fb950');
  d3.selectAll('.iso-badge').transition().duration(dur)
    .attr('opacity', view==='today'?1:0);

  // In VC view, update Colegios sub-label
  nGroups.each(function(d) {
    if (d.id === 'COLEGIOS') {
      const subEl = d3.select(this).selectAll('.node-sub');
      subEl.text(view==='today' ? '⚠ AISLADOS · Sin API' : '✅ Emite MembresíaVC');
    }
  });

  // Update panels
  renderStats(view);
  renderLegend(view);
};

// Initial render
renderStats('today');
renderLegend('today');
</script>
